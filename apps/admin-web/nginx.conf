limit_req_zone $binary_remote_addr zone=admin_login:10m rate=1r/s;

server {
  listen 80;
  server_name _;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'" always;
  root /usr/share/nginx/html;
  location = /api/auth/login {
    limit_req zone=admin_login burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://api:4100/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }
  location /api/ {
    proxy_pass http://api:4100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }
  location / { try_files $uri /index.html; }
}
